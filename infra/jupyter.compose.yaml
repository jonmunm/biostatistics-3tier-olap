services:
  jupyter:
    build:
      context: ..
      dockerfile: infra/jupyter.Dockerfile
    container_name: jupyter
    profiles:
      - debug
    volumes:
      - ../.:/opt/spark/work-dir
      - ../data:${DATA_PATH}
      - gx_metadata:/opt/spark/work-dir/gx
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - SPARK_MODE=master
      - DATA_PATH=${DATA_PATH}
      - SCRIPTS_PATH=${SCRIPTS_PATH}
    command: >
      pyspark
